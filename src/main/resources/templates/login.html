<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Crypto Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="card-title mb-4">Crypto Alerts</h4>
            <p class="text-muted small">Введите токен из Telegram-бота или перейдите по ссылке из сообщения.</p>
            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">Токен</label>
                    <input type="text" name="token" class="form-control"
                           th:value="${token}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required>
                </div>
                <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
