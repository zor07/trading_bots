<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки — Crypto Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 640px;">
    <h4 class="mb-4">Настройки алертов</h4>

    <form method="post" action="/settings">
        <!-- Price Alert -->
        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>📈 Резкое движение цены</strong>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" name="enabled" id="priceEnabled"
                           th:checked="${priceSettings.enabled}">
                    <label class="form-check-label" for="priceEnabled">Включён</label>
                </div>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label">Порог срабатывания (%)</label>
                        <input type="number" name="threshold" class="form-control" step="0.1" min="0.1"
                               th:value="${priceSettings.threshold}">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Интервал свечи</label>
                        <select name="candleInterval" class="form-select">
                            <option th:each="interval : ${candleIntervals}"
                                    th:value="${interval}"
                                    th:text="${interval}"
                                    th:selected="${interval == priceSettings.candleInterval}">
                            </option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Количество свечей</label>
                        <input type="number" name="candleLimit" class="form-control" min="1" max="10"
                               th:value="${priceSettings.candleLimit}">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Cooldown (минуты)</label>
                        <input type="number" name="cooldownMinutes" class="form-control" min="1"
                               th:value="${priceSettings.cooldownMinutes}">
                    </div>
                </div>

                <!-- Excluded symbols -->
                <div class="mt-4">
                    <label class="form-label fw-semibold">Исключить из алертов</label>
                    <div class="row row-cols-3 g-2">
                        <div class="col" th:each="symbol : ${allSymbols}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       name="excludedSymbols"
                                       th:value="${symbol}"
                                       th:id="${'ex_' + symbol}"
                                       th:checked="${excludedSymbols.contains(symbol)}">
                                <label class="form-check-label small" th:for="${'ex_' + symbol}"
                                       th:text="${symbol}"></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Сохранить</button>
    </form>
</div>
</body>
</html>
