spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/tradingbot
    username: ${DB_USERNAME:tradingbot}
    password: ${DB_PASSWORD:tradingbot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  bot-username: ${TELEGRAM_BOT_USERNAME}

exchange:
  binance:
    base-url: https://fapi.binance.com
  bybit:
    base-url: https://api.bybit.com

alerts:
  symbols:
    top-n: 20
    update-interval: 24h
  price:
    interval: 60s
    candle-interval: 15m
    candle-limit: 3
    threshold: 2.5
    cooldown: 30m
    debug-mode: true
