app:
  base-url: http://localhost:8080

server:
  servlet:
    context-path: /trading-bots

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:tradingbot}
    username: ${DB_USERNAME:tradingbot}
    password: ${DB_PASSWORD:tradingbot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  bot-username: ${TELEGRAM_BOT_USERNAME}
  proxy-host: ${TELEGRAM_BOT_PROXY_HOST:}
  proxy-port: ${TELEGRAM_BOT_PROXY_PORT:0}

exchange:
  binance:
    base-url: https://fapi.binance.com
  bybit:
    base-url: https://api.bybit.com
    enabled: false

alerts:
  lsr:
    account-threshold: 5.0
    position-threshold: 5.0
    interval: PT60S
  symbols:
    limit: 100
    update-interval: PT3H
  price:
    interval: PT60S
    candle-interval: 15m
    candle-limit: 1
    threshold: 0.5

